<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; }
        .box { background: #1e293b; padding: 25px; border-radius: 15px; width: 350px; border: 1px solid #3b82f6; }
        .stat { margin: 10px 0; font-weight: bold; }
        button { width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 5px; background: #2563eb; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h3>⚽ RPG Career: <span id="nick">Barkamol</span></h3>
        <div class="stat">⚡ Энергия: <span id="energy">100</span>/100</div>
        <div class="stat">🏆 Репутация: <span id="rep">0</span></div>
        <hr>
        <button onclick="train()">Тренировка (Энергия -10)</button>
        <button onclick="match()">Сыграть матч (Энергия -30)</button>
        <button onclick="sleep()">Сон (Восстановить энергию)</button>
    </div>

    <script>
        let player = { energy: 100, rep: 0 };

        function updateUI() {
            document.getElementById('energy').innerText = player.energy;
            document.getElementById('rep').innerText = player.rep;
        }

        function train() {
            if (player.energy >= 10) {
                player.energy -= 10;
                player.rep += 5; // Улучшение навыка
                updateUI();
            } else { alert("Нужен отдых!"); }
        }

        function match() {
            if (player.energy >= 30) {
                player.energy -= 30;
                // Шанс на победу 60%
                if (Math.random() > 0.4) {
                    player.rep += 50;
                    alert("Победа в матче!");
                } else {
                    player.rep += 10;
                    alert("Ничья / Поражение.");
                }
                updateUI();
            } else { alert("Слишком устал для матча!"); }
        }

        function sleep() {
            player.energy = 100;
            updateUI();
        }
    </script>
</body>
</html>
