<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .tab-btn { background: #334155; padding: 10px; margin: 5px; cursor: pointer; border-radius: 5px; }
        .card { background: #1e293b; padding: 15px; width: 350px; margin: 5px; border-radius: 10px; }
        .val { color: #22c55e; }
    </style>
</head>
<body>
    <h2>💰 Капитал: $<span id="balance">1000</span></h2>
    <div>
        <button class="tab-btn" onclick="showTab('biz')">Бизнес</button>
        <button class="tab-btn" onclick="showTab('bank')">Банк</button>
    </div>
    <div id="content"></div>

    <script>
        let state = {
            balance: 1000,
            biz: [
                { name: "Кафе", lvl: 1, cost: 500, profit: 50 },
                { name: "Магазин", lvl: 1, cost: 2000, profit: 200 }
            ],
            bankDeposit: 0
        };

        function showTab(tab) {
            let html = "";
            if(tab === 'biz') {
                state.biz.forEach((b, i) => {
                    html += `<div class="card"><b>${b.name}</b> (Ур. ${b.lvl})<br>Доход: $${b.profit * b.lvl}/ч<br>
                    <button onclick="upgrade(${i})">Купить/Апгрейд ($${b.cost * b.lvl})</button></div>`;
                });
            } else {
                html = `<div class="card">Вклад: $${state.bankDeposit}<br>
                <button onclick="deposit(1000)">Положить $1000 (10% в час)</button></div>`;
            }
            document.getElementById('content').innerHTML = html;
        }

        function upgrade(i) {
            let b = state.biz[i];
            if(state.balance >= b.cost * b.lvl) {
                state.balance -= b.cost * b.lvl;
                b.lvl++;
                showTab('biz');
            }
        }

        function deposit(amt) {
            if(state.balance >= amt) { state.balance -= amt; state.bankDeposit += amt; showTab('bank'); }
        }

        setInterval(() => {
            state.biz.forEach(b => state.balance += (b.profit * b.lvl)/3600);
            state.balance += (state.bankDeposit * 0.1)/3600;
            document.getElementById('balance').innerText = Math.floor(state.balance);
        }, 1000);

        showTab('biz');
    </script>
</body>
</html>
