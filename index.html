<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 400px; }
        .card { background: #1e293b; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #334155; }
        button { background: #2563eb; border: none; padding: 10px; color: white; border-radius: 5px; cursor: pointer; width: 100%; }
        .val { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💰 Капитал: $<span id="balance">1000</span></h2>
        
        <div id="business-list"></div>
    </div>

    <script>
        let state = {
            balance: 1000,
            businesses: [
                { name: "Кафе", level: 1, cost: 500, profit: 50 },
                { name: "Магазин", level: 1, cost: 2000, profit: 200 },
                { name: "Завод", level: 1, cost: 10000, profit: 1000 }
            ]
        };

        function render() {
            let list = document.getElementById('business-list');
            list.innerHTML = "";
            state.businesses.forEach((b, i) => {
                list.innerHTML += `
                    <div class="card">
                        <b>${b.name} (Ур. ${b.level})</b><br>
                        Доход: <span class="val">$${b.profit * b.level}/час</span><br>
                        <button onclick="upgrade(${i})">Улучшить ($${b.cost * b.level})</button>
                    </div>
                `;
            });
            document.getElementById('balance').innerText = Math.floor(state.balance);
        }

        function upgrade(index) {
            let b = state.businesses[index];
            let price = b.cost * b.level;
            if (state.balance >= price) {
                state.balance -= price;
                b.level++;
                render();
            }
        }

        setInterval(() => {
            state.businesses.forEach(b => {
                state.balance += (b.profit * b.level) / 3600; // Доход в секунду (как 1 час)
            });
            render();
        }, 1000);

        render();
    </script>
</body>
</html>
