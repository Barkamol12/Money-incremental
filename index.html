<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Football Manager Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; min-height: 100vh; margin: 0; padding-top: 20px; }
        .box { background: rgba(30, 58, 138, 0.8); padding: 20px; border-radius: 20px; width: 400px; margin: 0 auto; border: 2px solid #60a5fa; backdrop-filter: blur(10px); }
        button { margin: 5px; padding: 10px; cursor: pointer; border-radius: 8px; border: none; background: #2563eb; color: white; font-weight: bold; width: 90%; }
        .leaderboard { margin-top: 15px; text-align: left; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="auth" class="box">
        <h3>Вход в клуб</h3>
        <input type="text" id="nick" placeholder="Имя игрока" style="padding: 8px; border-radius: 5px; border: none; width: 80%;">
        <button onclick="login()">Войти</button>
    </div>
    <div id="game" class="box" style="display:none;">
        <h2 id="name"></h2>
        <p>💰 Монеты: <span id="coins">0</span></p>
        <button onclick="showLeaderboard()">Показать таблицу лидеров</button>
        <div id="leaderboardDiv" class="leaderboard" style="display:none;"></div>
        <hr>
        <button onclick="clickTrain()">Тренироваться</button>
        <button onclick="upgradeClick()">Улучшить клик (100 монет)</button>
        <button onclick="playMatch('barca')">Barcelona (100 трен.)</button>
    </div>
    <script>
        firebase.initializeApp({databaseURL: "https://money-incremental-default-rtdb.firebaseio.com"});
        const db = firebase.database();
        let myNick = "", data = {coins: 0, training: 0, clickPower: 1};

        function login() {
            myNick = document.getElementById('nick').value.trim();
            if(!myNick) return;
            document.getElementById('auth').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('name').innerText = "Клуб: " + myNick;
            db.ref('players/' + myNick).on('value', (s) => {
                if(s.exists()) data = s.val();
                document.getElementById('coins').innerText = Math.floor(data.coins);
            });
        }

        function showLeaderboard() {
            let div = document.getElementById('leaderboardDiv');
            div.style.display = 'block';
            div.innerHTML = "Загрузка...";
            db.ref('players').orderByChild('coins').limitToLast(5).once('value', (s) => {
                div.innerHTML = "<h4>Топ 5 богачей:</h4>";
                let players = [];
                s.forEach(child => { players.push({name: child.key, coins: child.val().coins}); });
                players.reverse().forEach((p, i) => {
                    div.innerHTML += `${i+1}. ${p.name}: ${Math.floor(p.coins)} монет<br>`;
                });
            });
        }

        function clickTrain() { data.training += data.clickPower; updateDB(); }
        function upgradeClick() { if(data.coins >= 100) { data.coins -= 100; data.clickPower++; updateDB(); } }
        function playMatch(t) { if(t === 'barca' && data.training >= 100) { data.training -= 100; data.coins += 50; updateDB(); } }
        function updateDB() { db.ref('players/' + myNick).set(data); }
        
        setInterval(() => {
            if(myNick) {
                data.coins += (data.playersCount || 0) * 0.5;
                updateDB();
            }
        }, 1000);
    </script>
</body>
</html>
