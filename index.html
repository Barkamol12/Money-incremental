<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Football Manager Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; background: #064e3b; color: white; padding-top: 20px; }
        .box { background: #065f46; padding: 20px; border-radius: 15px; width: 350px; margin: 0 auto; border: 2px solid #34d399; }
        button { margin: 5px; padding: 10px; cursor: pointer; border-radius: 6px; border: none; background: #34d399; font-weight: bold; width: 90%; }
        .match-btn { background: #e11d48; color: white; }
    </style>
</head>
<body>
    <div id="auth" class="box">
        <h3>Вход в клуб</h3>
        <input type="text" id="nick" placeholder="Имя игрока">
        <button onclick="login()">Войти</button>
    </div>
    <div id="game" class="box" style="display:none;">
        <h2 id="name"></h2>
        <p>💰 Бюджет: <span id="coins">0</span></p>
        <p>⚽ Тренировки: <span id="training">0</span></p>
        <p>🏃 Игроки: <span id="playersCount">0</span> | 🌟 Роналду: <span id="ronaldo">0</span></p>
        <hr>
        <button onclick="clickTrain()">Тренироваться (+1)</button>
        <hr>
        <h3>Матчи:</h3>
        <button class="match-btn" onclick="playMatch('barca')">Barcelona (Easy) - 50 монет (Тренировок: 100)</button>
        <button class="match-btn" onclick="playMatch('city')">Man City (Med) - 500 монет (Тренировок: 1000)</button>
        <button class="match-btn" onclick="playMatch('real')">Real Madrid (Imp) - Ronaldo (Тренировок: 100000)</button>
    </div>
    <script>
        firebase.initializeApp({databaseURL: "https://money-incremental-default-rtdb.firebaseio.com"});
        const db = firebase.database();
        let myNick = "", data = {coins: 0, training: 0, playersCount: 0, ronaldo: 0};

        function login() {
            myNick = document.getElementById('nick').value.trim();
            if(!myNick) return;
            document.getElementById('auth').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('name').innerText = "Клуб: " + myNick;
            
            db.ref('players/' + myNick).on('value', (s) => {
                if(s.exists()) {
                    let d = s.val();
                    data = { coins: d.coins || 0, training: d.training || 0, playersCount: d.playersCount || 0, ronaldo: d.ronaldo || 0 };
                }
                document.getElementById('coins').innerText = Math.floor(data.coins);
                document.getElementById('training').innerText = Math.floor(data.training);
                document.getElementById('playersCount').innerText = data.playersCount;
                document.getElementById('ronaldo').innerText = data.ronaldo;
            });
        }
        
        function clickTrain() { data.training++; updateDB(); }
        
        function playMatch(team) {
            if(team === 'barca' && data.training >= 100) { data.training -= 100; data.coins += 50; }
            else if(team === 'city' && data.training >= 1000) { data.training -= 1000; data.coins += 500; }
            else if(team === 'real' && data.training >= 100000) { data.training -= 100000; data.ronaldo++; }
            else { alert("Недостаточно тренировок!"); return; }
            updateDB();
        }

        function updateDB() { db.ref('players/' + myNick).set(data); }
        
        setInterval(() => {
            if(myNick) {
                data.coins += (data.playersCount * 0.5) + (data.ronaldo * 1000);
                updateDB();
            }
        }, 1000);
    </script>
</body>
</html>
